version: 1.2.1

interface:
  mcpServers:
    use: true
    create: true
    share: false

# Limite l'historique renvoyé à chaque message (cause principale de la consommation).
# 3000 tokens = environ les 4 à 6 derniers messages (questions + réponses courtes).
# Les anciens messages au-delà ne sont plus envoyés à DeepSeek.
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "deepseek-flash-eco"
      label: "DeepSeek Flash (éco)"
      default: true
      preset:
        endpoint: "DeepSeek"
        model: "deepseek-v4-flash"
        maxContextTokens: 3000

endpoints:
  custom:
    # DeepSeek passe par « vision-bridge » (Worker Cloudflare) : les images et PDF
    # sont d'abord lus par Gemini, puis le texte est transmis à DeepSeek.
    # Clé à saisir dans l'interface : clé_deepseek,clé_gemini (séparées par une virgule).
    # Modèle unique = flash (moins cher). titleConvo désactivé : chaque titre
    # automatique était un appel API supplémentaire avec le modèle courant.
    - name: "DeepSeek"
      apiKey: "user_provided"
      baseURL: "https://vision-bridge.hounmetinjeremy.workers.dev/v1"
      models:
        default: ["deepseek-v4-flash"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "DeepSeek"

    # DeepSeek R1 (14B) hébergé sur un GPU Modal (service deepseek-api).
    # Texte uniquement. Le GPU s'éteint après 5 min d'inactivité : le premier
    # message après une pause peut prendre environ 3 minutes (démarrage à froid).
    # Clé à saisir dans l'interface : la clé API du service Modal.
    # titleConvo désactivé : un titre automatique réveillait le GPU pour rien.
    - name: "DeepSeek GPU"
      apiKey: "user_provided"
      baseURL: "https://g64203490--deepseek-api-serve.us-east.modal.run/v1"
      models:
        default: ["deepseek-r1"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "DeepSeek GPU"

mcpServers:
  cloudflare:
    type: streamable-http
    url: https://mcp.cloudflare.com/mcp
    requiresOAuth: true
    timeout: 60000
