version: 1.2.1

interface:
  # Sélecteur de modèle direct : seuls « Aube » et « Soleil » apparaissent (voir modelSpecs plus bas).
  modelSelect: true
  mcpServers:
    use: true
    create: true
    share: false

endpoints:
  # 1 message = 1 requête (sans outil). Avec un agent et un outil : 2 requêtes maximum
  # (appel d'outil + réponse finale). Jamais plus.
  agents:
    recursionLimit: 2
    maxRecursionLimit: 2

  custom:
    # Les utilisateurs ne voient que « Aube » et « Soleil ».
    # Le fournisseur (DeepSeek ou Gemini), le vrai modèle et les clés se règlent dans la
    # page admin « Clés API » (compte ADMIN). Si une clé échoue, le serveur bascule tout seul
    # sur l'autre. LibreChat appelle sa propre route interne /ai-proxy
    # (api/server/routes/aiModels.js), qui lit ces réglages et transmet au bon fournisseur.
    # Les images et PDF sont d'abord lus par Gemini, puis le texte est transmis au modèle.
    # apiKey : valeur factice obligatoire pour LibreChat ; la vraie clé n'est jamais ici.
    # 3080 = internal_port de fly.toml.
    # titleConvo DÉSACTIVÉ : la génération de titre est une requête supplémentaire.
    # Historique résumé et limite de sortie AUTOMATIQUE : voir patch-history-limit.js
    # (réponse limitée à 1200 tokens, sans limite dès que le message demande du code).
    # Max Context Tokens : à régler dans l'interface (3000 sans outil, 6000 avec MCP légers).
    # Température basse : moins de réponses inventées.
    # iconURL : ton logo (écrit dans /assets/jeremy-logo.svg par patch-branding.js).
    - name: "Modèles"
      apiKey: "interne"
      baseURL: "http://127.0.0.1:3080/ai-proxy/v1"
      models:
        default: ["Aube", "Soleil"]
        fetch: false
      titleConvo: false
      addParams:
        temperature: 0.2
      modelDisplayLabel: "Assistant"
      iconURL: "/assets/jeremy-logo.svg"

    # Génération de vidéos LTX-2.5 sur Modal (service ltx-2-5). Le modèle choisi = la durée
    # totale : video-12s, video-24s, video-36s, video-48s, video-60s.
    # Mode d'emploi : joindre la photo du personnage (facultatif), écrire une scène par
    # paragraphe (ligne vide entre chaque scène), envoyer. La vidéo est prête en quelques
    # minutes ; le lien apparaît dans la réponse.
    # Clé fournie par le serveur (secret Fly VIDEO_API_KEY ; jamais écrite ici : dépôt public).
    # titleConvo désactivé : un titre automatique lancerait une génération vidéo.
    # Cet accès n'apparaît plus dans le sélecteur de l'interface (voir modelSpecs).
    - name: "Vidéo"
      apiKey: "${VIDEO_API_KEY}"
      baseURL: "https://g64203490--ltx-2-5-mcp.us-east.modal.run/v1"
      models:
        default: ["video-12s", "video-24s", "video-36s", "video-48s", "video-60s"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Vidéo"
      iconURL: "/assets/jeremy-logo.svg"

# Sélecteur direct : un seul bouton avec « Aube » et « Soleil », sans niveau « Modèles » ni « Vidéo ».
# Aube est présélectionné pour toute nouvelle conversation.
# mcpServers : outils activés automatiquement dans chaque conversation avec ce modèle.
# Seul « sandbox » (terminal jetable) est automatique : l'IA lit le message de l'utilisateur et décide
# seule d'appeler le terminal. GitHub n'est PAS requis avant : le lien de connexion n'est donné par
# l'outil que si la tâche en a besoin (cloner un projet, en créer un).
# Un serveur avec connexion OAuth (github, cloudflare, connexion-github) ne doit PAS être ici, sinon
# chaque message attend la connexion et reste bloqué.
# Si le chat affiche « The agent is configured to use MCP tools, but none are available », c'est que
# sandbox ne se connecte pas : retirer mcpServers ci-dessous et vérifier les logs de jeremy-sbx-orch.
# Le bouton + (menu des serveurs MCP) reste visible : les autres serveurs y restent accessibles.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "aube"
      label: "Aube"
      default: true
      iconURL: "/assets/jeremy-logo.svg"
      mcpServers: ["sandbox"]
      preset:
        endpoint: "Modèles"
        model: "Aube"
    - name: "soleil"
      label: "Soleil"
      iconURL: "/assets/jeremy-logo.svg"
      mcpServers: ["sandbox"]
      preset:
        endpoint: "Modèles"
        model: "Soleil"

mcpServers:
  cloudflare:
    type: streamable-http
    url: https://mcp.cloudflare.com/mcp
    requiresOAuth: true
    timeout: 60000

  # Serveur GitHub léger (1 outil, environ 300 tokens). Chaque utilisateur clique
  # « Connecter » : OAuth GitHub automatique, token stocké par LibreChat pour lui.
  github:
    type: streamable-http
    url: https://github-mcp-lite.hounmetinjeremy.workers.dev
    requiresOAuth: true
    timeout: 60000

  # Connexion GitHub intégrée à LibreChat (api/server/routes/githubLink.js) : apparaît dans le menu +,
  # l'utilisateur clique « Connecter », autorise GitHub, et son token est rangé chiffré pour le terminal.
  # X-Link-Key prouve que l'appel vient bien de ce LibreChat avant de rattacher le compte à l'utilisateur.
  connexion-github:
    type: streamable-http
    url: https://librechat-a7cwuq.fly.dev/api/github-link/mcp
    requiresOAuth: true
    headers:
      X-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-Link-Key: "${ORCHESTRATOR_SECRET}"
    timeout: 60000

  # Terminal Linux jetable sur Fly.io : LibreChat ne fait que commander l'orchestrateur, qui crée un
  # conteneur par tâche (clone, vérifications, correction, déploiement, push, PR) puis le détruit.
  # chatMenu: false = ce serveur seul est caché du menu + ; les autres serveurs y restent visibles.
  # Il est activé en arrière-plan pour Aube et Soleil (modelSpecs.mcpServers) ; l'IA décide seule.
  # GitHub : plus de token à saisir. L'utilisateur connecte son compte GitHub une fois, soit par le
  # bouton « connexion-github » du menu +, soit par le lien donné par l'outil ; l'orchestrateur
  # récupère son token chiffré (route /api/github-link de LibreChat).
  # L'identité vient de LibreChat (non falsifiable) ; quotas de tâches et de tokens par utilisateur.
  # Secret Fly : ORCHESTRATOR_SECRET.
  sandbox:
    type: streamable-http
    url: ${SANDBOX_MCP_URL}
    chatMenu: false
    headers:
      Authorization: "Bearer ${ORCHESTRATOR_SECRET}"
      X-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-Svc-Vercel: "{{VERCEL_TOKEN}}"
      X-Svc-Cloudflare: "{{CLOUDFLARE_API_TOKEN}}"
      X-Svc-Render: "{{RENDER_API_KEY}}"
      X-Svc-Fly: "{{FLY_API_TOKEN}}"
    customUserVars:
      VERCEL_TOKEN:
        title: "Clé Vercel"
        description: "Facultatif. Si tu n'en as pas, écris : aucun"
      CLOUDFLARE_API_TOKEN:
        title: "Clé Cloudflare"
        description: "Facultatif. Si tu n'en as pas, écris : aucun"
      RENDER_API_KEY:
        title: "Clé Render"
        description: "Facultatif. Si tu n'en as pas, écris : aucun"
      FLY_API_TOKEN:
        title: "Clé Fly.io"
        description: "Facultatif. Si tu n'en as pas, écris : aucun"
    timeout: 60000
    serverInstructions: "Pour toute tâche de code, de projet ou de déploiement, appelle run_task une seule fois, puis dis à l'utilisateur de redemander le statut plus tard (get_job). Ne boucle jamais. Si l'outil répond que GitHub n'est pas connecté, donne à l'utilisateur le lien fourni, tel quel, et dis-lui de redemander sa tâche après la connexion."
