        default: ["@cf/zai-org/glm-5.3-flash", "@cf/openai/gpt-oss-120b", "@cf/meta/llama-3.3-70b-instruct-fp8-fast"]
        fetch: false
      titleConvo: true
      titleModel: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      modelDisplayLabel: "Cloudflare Workers AI"

