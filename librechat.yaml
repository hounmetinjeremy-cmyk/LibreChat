version: 1.2.1

interface:
  # Sélecteur de modèle direct : seuls « Aube » et « Soleil » apparaissent (voir modelSpecs plus bas).
  modelSelect: true
  mcpServers:
    use: true
    create: true
    share: false

# Dictée vocale : bouton micro dans la zone de saisie, le texte s'écrit en direct pendant que tu parles
# (moteur du navigateur : HTTPS obligatoire, surtout Chrome).
# autoSendText: -1 = pas d'envoi automatique : tu appuies toi-même sur la flèche quand tu as fini.
speech:
  speechTab:
    conversationMode: false
    advancedMode: false
    speechToText:
      engineSTT: "browser"
      languageSTT: "French (France)"
      autoTranscribeAudio: true
      decibelValue: -45
      autoSendText: -1

endpoints:
  # Limite d'étapes par message. Une étape = un passage du modèle OU des outils.
  # Modèle à moteur unique : l'IA du chat pilote le terminal commande par commande (execute_command),
  # chaque commande coûte donc des étapes. 100 permet une tâche complète (clone, édition, tests, push).
  agents:
    recursionLimit: 100
    maxRecursionLimit: 100

  custom:
    # Les utilisateurs ne voient que « Aube » et « Soleil ».
    # Le fournisseur (DeepSeek ou Gemini), le vrai modèle et les clés se règlent dans la
    # page admin « Clés API » (compte ADMIN). Si une clé échoue, le serveur bascule tout seul
    # sur l'autre. LibreChat appelle sa propre route interne /ai-proxy
    # (api/server/routes/aiModels.js), qui lit ces réglages et transmet au bon fournisseur.
    # Les images et PDF sont d'abord lus par Gemini, puis le texte est transmis au modèle.
    # apiKey : valeur factice obligatoire pour LibreChat ; la vraie clé n'est jamais ici.
    # 3080 = internal_port de fly.toml.
    # titleConvo DÉSACTIVÉ : la génération de titre est une requête supplémentaire.
    # Historique résumé et limite de sortie AUTOMATIQUE : voir patch-history-limit.js
    # (réponse limitée à 1200 tokens, sans limite dès que le message demande du code).
    # Max Context Tokens : à régler dans l'interface (3000 sans outil, 6000 avec MCP légers).
    # Température basse : moins de réponses inventées.
    # iconURL : ton logo (écrit dans /assets/jeremy-logo.svg par patch-branding.js).
    - name: "Modèles"
      apiKey: "interne"
      baseURL: "http://127.0.0.1:3080/ai-proxy/v1"
      models:
        default: ["Aube", "Soleil"]
        fetch: false
      titleConvo: false
      addParams:
        temperature: 0.2
      modelDisplayLabel: "Assistant"
      iconURL: "/assets/jeremy-logo.svg"

    # Génération de vidéos LTX-2.5 sur Modal (service ltx-2-5). Le modèle choisi = la durée
    # totale : video-12s, video-24s, video-36s, video-48s, video-60s.
    # Mode d'emploi : joindre la photo du personnage (facultatif), écrire une scène par
    # paragraphe (ligne vide entre chaque scène), envoyer. La vidéo est prête en quelques
    # minutes ; le lien apparaît dans la réponse.
    # Clé fournie par le serveur (secret Fly VIDEO_API_KEY ; jamais écrite ici : dépôt public).
    # titleConvo désactivé : un titre automatique lancerait une génération vidéo.
    # Cet accès n'apparaît plus dans le sélecteur de l'interface (voir modelSpecs).
    - name: "Vidéo"
      apiKey: "${VIDEO_API_KEY}"
      baseURL: "https://g64203490--ltx-2-5-mcp.us-east.modal.run/v1"
      models:
        default: ["video-12s", "video-24s", "video-36s", "video-48s", "video-60s"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Vidéo"
      iconURL: "/assets/jeremy-logo.svg"

# Sélecteur direct : un seul bouton avec « Aube » et « Soleil », sans niveau « Modèles » ni « Vidéo ».
# Aube est présélectionné pour toute nouvelle conversation.
# mcpServers : outils activés automatiquement dans chaque conversation avec ce modèle.
# Seul « sandbox » (terminal jetable) est automatique : l'IA lit le message de l'utilisateur et décide
# seule d'appeler le terminal. GitHub n'est PAS requis avant : le lien de connexion n'est donné par
# l'outil que si la tâche en a besoin (cloner un projet, en créer un).
# Un serveur avec connexion OAuth (github, cloudflare, connexion-github) ne doit PAS être ici, sinon
# chaque message attend la connexion et reste bloqué.
# Si le chat affiche « The agent is configured to use MCP tools, but none are available », c'est que
# sandbox ne se connecte pas : retirer mcpServers ci-dessous et vérifier les logs de jeremy-sbx-orch.
# Le bouton + (menu des serveurs MCP) reste visible : les autres serveurs y restent accessibles.
# Aube et Soleil utilisent le même terminal ; c'est l'IA du chat qui travaille (moteur unique).
modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: "aube"
      label: "Aube"
      default: true
      iconURL: "/assets/jeremy-logo.svg"
      mcpServers: ["sandbox"]
      preset:
        endpoint: "Modèles"
        model: "Aube"
    - name: "soleil"
      label: "Soleil"
      iconURL: "/assets/jeremy-logo.svg"
      mcpServers: ["sandbox-soleil"]
      preset:
        endpoint: "Modèles"
        model: "Soleil"

mcpServers:
  cloudflare:
    type: streamable-http
    url: https://mcp.cloudflare.com/mcp
    requiresOAuth: true
    timeout: 60000

  # Serveur GitHub léger (1 outil, environ 300 tokens). Chaque utilisateur clique
  # « Connecter » : OAuth GitHub automatique, token stocké par LibreChat pour lui.
  github:
    type: streamable-http
    url: https://github-mcp-lite.hounmetinjeremy.workers.dev
    requiresOAuth: true
    timeout: 60000

  # Connexion GitHub intégrée à LibreChat (api/server/routes/githubLink.js) : apparaît dans le menu +,
  # l'utilisateur clique « Connecter », autorise GitHub, et son token est rangé chiffré pour le terminal.
  # X-Link-Key prouve que l'appel vient bien de ce LibreChat avant de rattacher le compte à l'utilisateur.
  connexion-github:
    type: streamable-http
    url: https://librechat-a7cwuq.fly.dev/api/github-link/mcp
    requiresOAuth: true
    headers:
      X-User-Id: "{{LIBRECHAT_USER_ID}}"
      X-Link-Key: "${ORCHESTRATOR_SECRET}"
    timeout: 60000

  # Terminal Linux jetable sur Fly.io, MOTEUR UNIQUE : l'IA du chat pilote le terminal avec execute_command
  # (une commande bash par appel). L'orchestrateur ouvre un conteneur à la première commande et le ferme
  # après 10 min d'inactivité. Le conteneur n'a aucune IA ni clé LLM. Au clic sur Stop, l'appel MCP est
  # annulé et la commande en cours est tuée immédiatement dans le conteneur.
  # chatMenu: false = ce serveur seul est caché du menu + ; les autres serveurs y restent visibles.
  # Activé en arrière-plan pour Aube et Soleil (modelSpecs.mcpServers) ; l'IA décide seule.
  # AUCUNE variable utilisateur à remplir. GitHub : l'utilisateur connecte son compte une fois (bouton
  # « connexion-github » du menu + ou lien donné par l'outil) OU envoie un token dans le chat.
  # Le timeout (200 s) doit rester supérieur à CMD_MAX_SEC de l'orchestrateur (170 s par défaut).
  # Outils : find_repos, execute_command, close_session, my_quota, link_pages.
  # Secret Fly : ORCHESTRATOR_SECRET. SANDBOX_MCP_URL sert aussi au panneau de suivi.
  sandbox:
    type: streamable-http
    url: ${SANDBOX_MCP_URL}?tier=aube
    chatMenu: false
    headers:
      Authorization: "Bearer ${ORCHESTRATOR_SECRET}"
      X-User-Id: "{{LIBRECHAT_USER_ID}}"
    timeout: 200000
    serverInstructions: &sbxInstructions >-
      Terminal Linux jetable pour toute tâche de code, de projet ou de déploiement. Tu le pilotes toi-même avec l'outil execute_command : une commande bash par appel, dossier de départ /work, la sortie t'est renvoyée. Tout se fait par commandes, une étape à la fois, en lisant chaque résultat avant la suivante : git clone, lecture et écriture de fichiers (cat, sed, heredoc), installation, tests, build, déploiement, git commit et push. Chaque appel démarre un bash neuf : utilise le paramètre cwd ou cd dossier && commande. Les fichiers persistent entre les appels. Si l'utilisateur ne donne pas le nom exact du dépôt (propriétaire/nom), appelle d'abord find_repos avec les mots qu'il a écrits, propose-lui les dépôts trouvés en une phrase courte (Tu parles de X ?) et attends son oui avant de cloner. S'il donne le nom exact, clone directement. Ne lis pas tout le projet : cherche avec grep, lis seulement les extraits utiles. Quand l'utilisateur clique sur Stop, la commande en cours est tuée immédiatement : ne la relance pas et n'enchaîne pas d'autres commandes, attends sa prochaine demande. Quand le travail est terminé, résume en quelques phrases ce qui est fait, ce qui reste à faire et le lien utile (pull request, site), puis appelle close_session (facultatif : le terminal se ferme aussi tout seul après 10 minutes sans commande). Ne demande jamais de clé ni de token à l'utilisateur sauf si la tâche en a vraiment besoin. Si un résultat indique que GitHub n'est pas connecté, suis ses indications (lien de connexion tel quel, ou token envoyé dans le chat à passer dans le paramètre github_token). Si la tâche demande Cloudflare : si les outils du connecteur cloudflare sont disponibles dans cette conversation, utilise-les directement (création de la base D1, requêtes SQL, configuration) sans demander de clé ; sinon propose d'abord d'activer le connecteur cloudflare depuis le menu + (connexion OAuth), ou de déployer avec wrangler (la clé est déjà dans l'environnement du terminal quand le compte est connecté) et de relier le dépôt à Cloudflare Pages avec link_pages. Clé Cloudflare envoyée dans le chat (paramètre cloudflare_token) = dernier recours. Si la tâche demande Vercel, Render ou Fly.io, dis à l'utilisateur de générer sa clé sur le site du service et de te l'envoyer dans le chat, puis passe-la dans le paramètre correspondant d'execute_command (vercel_token, render_key, fly_token). N'affiche jamais une clé dans une commande ni dans ta réponse.

  # Même terminal pour Soleil (même orchestrateur ; seul le modèle du chat diffère).
  sandbox-soleil:
    type: streamable-http
    url: ${SANDBOX_MCP_URL}?tier=soleil
    chatMenu: false
    headers:
      Authorization: "Bearer ${ORCHESTRATOR_SECRET}"
      X-User-Id: "{{LIBRECHAT_USER_ID}}"
    timeout: 200000
    serverInstructions: *sbxInstructions
