version: 1.2.1
endpoints:
  google:
    apiKey: "user_provided"
    models:
      default: ["gemini-3.1-pro-preview", "gemini-3-flash-preview", "gemini-3.1-flash-lite-preview"]
      fetch: true
    titleConvo: true
    titleModel: "gemini-3.1-flash-lite-preview"
    modelDisplayLabel: "Google Gemini"
  anthropic:
    apiKey: "user_provided"
    models:
      default: ["claude-opus-5-5", "claude-sonnet-5", "claude-haiku-4-5-20251001"]
      fetch: true
    titleConvo: true
    titleModel: "claude-haiku-4-5-20251001"
    modelDisplayLabel: "Anthropic Claude"
  custom:
    - name: "Groq"
      apiKey: "user_provided"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
        fetch: true
      titleConvo: true
      titleModel: "llama-3.1-8b-instant"
      modelDisplayLabel: "Groq"
    - name: "Workers AI"
      apiKey: "${CLOUDFLARE_API_TOKEN}"
      baseURL: "https://api.cloudflare.com/client/v4/accounts/26a324f0e475aeaace451e11617c1109/ai/v1"
      models:
        default: ["@cf/moonshotai/kimi-k2.7-code", "@cf/zai-org/glm-5.3", "@cf/zai-org/glm-5.3-flash", "@cf/openai/gpt-oss-120b", "@cf/meta/llama-3.3-70b-instruct-fp8-fast"]
        fetch: false
      titleConvo: true
      titleModel: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      modelDisplayLabel: "Cloudflare Workers AI"
    - name: "DeepSeek"
      apiKey: "user_provided"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default: ["deepseek-chat", "deepseek-reasoner"]
        fetch: true
      titleConvo: true
      titleModel: "deepseek-chat"
      modelDisplayLabel: "DeepSeek"
    - name: "OpenRouter"
      apiKey: "user_provided"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        default: ["openai/gpt-5.2", "google/gemini-3.1-pro-preview", "anthropic/claude-opus-5-5", "deepseek/deepseek-v4-pro"]
        fetch: true
      titleConvo: true
      titleModel: "openai/gpt-5.2"
      modelDisplayLabel: "OpenRouter (multi-modèles)"
      dropParams: ["stop"]

mcpServers:
  chap-libre-toolkit:
    type: streamable-http
    url: https://chap-libre-mcp-toolkit.onrender.com/mcp
    headers:
      Authorization: "Bearer ${MCP_AUTH_TOKEN}"
    timeout: 60000
  render:
    type: streamable-http
    url: https://render-mcp-server-6za1.onrender.com/mcp
    headers:
      Authorization: "Bearer ${RENDER_MCP_TOKEN}"
    timeout: 60000
  cloudflare:
    type: streamable-http
    url: https://mcp.cloudflare.com/mcp
    requiresOAuth: true
    timeout: 60000
