version: 1.2.1
endpoints:
  google:
    apiKey: "user_provided"
  anthropic:
    apiKey: "user_provided"
  custom:
    - name: "Groq"
      apiKey: "user_provided"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
        fetch: true
      titleConvo: true
      titleModel: "llama-3.1-8b-instant"
      modelDisplayLabel: "Groq"
    - name: "Workers AI"
      apiKey: "${CLOUDFLARE_API_TOKEN}"
      baseURL: "https://api.cloudflare.com/client/v4/accounts/26a324f0e475aeaace451e11617c1109/ai/v1"
      models:
        default: ["@cf/moonshotai/kimi-k2.7-code", "@cf/zai-org/glm-5.3", "@cf/zai-org/glm-5.3-flash", "@cf/openai/gpt-oss-120b", "@cf/meta/llama-3.3-70b-instruct-fp8-fast"]
        fetch: false
      titleConvo: true
      titleModel: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      modelDisplayLabel: "Cloudflare Workers AI"

mcpServers:
  chap-libre-toolkit:
    type: streamable-http
    url: https://chap-libre-mcp-toolkit.onrender.com/mcp
    headers:
      Authorization: "Bearer ${MCP_AUTH_TOKEN}"
    timeout: 60000
  render:
    type: streamable-http
    url: https://render-mcp-server-6za1.onrender.com/mcp
    headers:
      Authorization: "Bearer ${RENDER_MCP_TOKEN}"
    timeout: 60000
  cloudflare:
    type: streamable-http
    url: https://mcp-cloudflare.onrender.com/mcp
    customUserVars:
      CLOUDFLARE_API_TOKEN:
        title: "Connexion Cloudflare"
        description: "1) Va sur dash.cloudflare.com et connecte-toi. 2) Clique sur ton profil (en haut à droite) → 'My Profile' → onglet 'API Tokens'. 3) Clique 'Create Token', choisis le modèle 'Edit Cloudflare Workers', puis 'Continue to summary' → 'Create Token'. 4) Copie le code affiché et colle-le ici. C'est tout — aucune autre information n'est nécessaire."
    headers:
      Authorization: "Bearer {{CLOUDFLARE_API_TOKEN}}"
    timeout: 60000
