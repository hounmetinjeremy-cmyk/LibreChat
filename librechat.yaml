version: 1.2.1

interface:
  mcpServers:
    use: true
    create: true
    share: false

endpoints:
  # Limite les boucles d'outils : chaque appel d'outil relance une requête avec tout le contexte.
  agents:
    recursionLimit: 8
    maxRecursionLimit: 12

  custom:
    # DeepSeek passe par « vision-bridge » (Worker Cloudflare) : les images et PDF
    # sont d'abord lus par Gemini, puis le texte est transmis à DeepSeek.
    # Clé à saisir dans l'interface : clé_deepseek,clé_gemini (séparées par une virgule).
    # Noms affichés : « Jérémy Flash » (économique) et « Jérémy Pro » (environ 3 fois plus cher).
    # vision-bridge les traduit vers les vrais modèles. titleConvo désactivé : chaque titre
    # automatique était un appel API supplémentaire avec le modèle courant.
    # Le nombre de messages d'historique est limité par patch-history-limit.js
    # (variable MAX_HISTORY_MESSAGES). Max Context Tokens : à régler dans l'interface
    # (3000 sans outil, 6000 avec des serveurs MCP légers).
    # Température basse : moins de réponses inventées.
    - name: "DeepSeek"
      apiKey: "user_provided"
      baseURL: "https://vision-bridge.hounmetinjeremy.workers.dev/v1"
      models:
        default: ["Jérémy Flash", "Jérémy Pro"]
        fetch: false
      titleConvo: false
      addParams:
        temperature: 0.2
      modelDisplayLabel: "Jérémy"

    # DeepSeek R1 (14B) hébergé sur un GPU Modal (service deepseek-api).
    # Texte uniquement. Le GPU s'éteint après 5 min d'inactivité : le premier
    # message après une pause peut prendre environ 3 minutes (démarrage à froid).
    # Clé à saisir dans l'interface : la clé API du service Modal.
    # titleConvo désactivé : un titre automatique réveillait le GPU pour rien.
    - name: "DeepSeek GPU"
      apiKey: "user_provided"
      baseURL: "https://g64203490--deepseek-api-serve.us-east.modal.run/v1"
      models:
        default: ["deepseek-r1"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Jérémy GPU"

mcpServers:
  cloudflare:
    type: streamable-http
    url: https://mcp.cloudflare.com/mcp
    requiresOAuth: true
    timeout: 60000

  # Serveur GitHub léger (1 outil, environ 300 tokens). Chaque utilisateur clique
  # « Connecter » : OAuth GitHub automatique, token stocké par LibreChat pour lui.
  github:
    type: streamable-http
    url: https://github-mcp-lite.hounmetinjeremy.workers.dev
    requiresOAuth: true
    timeout: 60000

  # Génération de vidéos LTX-2.5 sur Modal (2 outils très courts : creer_video, etat_video).
  # La clé n'est PAS écrite ici (dépôt public) : elle vient du secret Fly LTX_API_KEY.
  video:
    type: streamable-http
    url: https://g64203490--ltx-2-5-mcp.us-east.modal.run/mcp
    headers:
      Authorization: "Bearer ${LTX_API_KEY}"
    timeout: 60000
