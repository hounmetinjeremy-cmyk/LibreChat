version: 1.2.1
endpoints:
  google:
    apiKey: "user_provided"
  anthropic:
    apiKey: "user_provided"
  custom:
    - name: "Groq"
      apiKey: "user_provided"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]
        fetch: true
      titleConvo: true
      titleModel: "llama-3.1-8b-instant"
      modelDisplayLabel: "Groq"
    - name: "Workers AI"
      apiKey: "${CLOUDFLARE_API_TOKEN}"
      baseURL: "https://api.cloudflare.com/client/v4/accounts/26a324f0e475aeaace451e1617c1109/ai/v1"
      models:
        default: ["@cf/moonshotai/kimi-k2.7-code", "@cf/zai-org/glm-5.3", "@cf/zai-org/glm-5.3-flash", "@cf/openai/gpt-oss-120b", "@cf/meta/llama-3.3-70b-instruct-fp8-fast"]
        fetch: false
      titleConvo: true
      titleModel: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
      modelDisplayLabel: "Cloudflare Workers AI"
    - name: "DeepSeek"
      apiKey: "user_provided"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default: ["deepseek-chat", "deepseek-reasoner"]
        fetch: true
      titleConvo: true
      titleModel: "deepseek-chat"
      modelDisplayLabel: "DeepSeek"

mcpServers:
  cloudflare:
    type: streamable-http
    url: https://mcp.cloudflare.com/mcp
    requiresOAuth: true
    timeout: 60000
