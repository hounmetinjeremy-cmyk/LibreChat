version: 1.2.1

interface:
  mcpServers:
    use: true
    create: true
    share: false

endpoints:
  # 1 message = 1 requête (sans outil). Avec un agent et un outil : 2 requêtes maximum
  # (appel d'outil + réponse finale). Jamais plus.
  agents:
    recursionLimit: 2
    maxRecursionLimit: 2

  custom:
    # Le modèle derrière passe par « vision-bridge » (Worker Cloudflare) : les images et PDF
    # sont d'abord lus par Gemini, puis le texte est transmis au modèle.
    # Clé à saisir dans l'interface : clé_deepseek,clé_gemini (séparées par une virgule).
    # Noms affichés : « Aube » (rapide, économique) et « Soleil » (le grand modèle, environ 3 fois plus cher).
    # vision-bridge les traduit vers les vrais modèles.
    # titleConvo DÉSACTIVÉ : la génération de titre est une requête supplémentaire.
    # Le nombre de messages d'historique est limité par patch-history-limit.js
    # (variable MAX_HISTORY_MESSAGES). Max Context Tokens : à régler dans l'interface
    # (3000 sans outil, 6000 avec des serveurs MCP légers).
    # Sortie limitée : max_tokens 1200 par réponse (les tokens de sortie coûtent plus cher).
    # Pour le code : utiliser « Jérémy Code » (ci-dessous), sans limite de sortie.
    # Température basse : moins de réponses inventées.
    # name : c'est le nom affiché dans le sélecteur de modèles (plus de « DeepSeek » visible).
    # iconURL : ton logo (écrit dans /assets/jeremy-logo.svg par patch-branding.js).
    - name: "Jérémy"
      apiKey: "user_provided"
      baseURL: "https://vision-bridge.hounmetinjeremy.workers.dev/v1"
      models:
        default: ["Aube", "Soleil"]
        fetch: false
      titleConvo: false
      addParams:
        temperature: 0.2
        max_tokens: 1200
      modelDisplayLabel: "Jérémy"
      iconURL: "/assets/jeremy-logo.svg"

    # Même modèle, mais SANS limite de sortie : pour écrire du code complet sans coupure.
    # Même clé à saisir dans l'interface que pour « Jérémy » (clé_deepseek,clé_gemini).
    - name: "Jérémy Code"
      apiKey: "user_provided"
      baseURL: "https://vision-bridge.hounmetinjeremy.workers.dev/v1"
      models:
        default: ["Aube", "Soleil"]
        fetch: false
      titleConvo: false
      addParams:
        temperature: 0.2
      modelDisplayLabel: "Jérémy Code"
      iconURL: "/assets/jeremy-logo.svg"

    # Modèle R1 (14B) hébergé sur un GPU Modal (service deepseek-api).
    # Texte uniquement. Le GPU s'éteint après 5 min d'inactivité : le premier
    # message après une pause peut prendre environ 3 minutes (démarrage à froid).
    # Clé à saisir dans l'interface : la clé API du service Modal.
    # titleConvo désactivé : un titre automatique réveillait le GPU pour rien.
    - name: "Jérémy GPU"
      apiKey: "user_provided"
      baseURL: "https://g64203490--deepseek-api-serve.us-east.modal.run/v1"
      models:
        default: ["deepseek-r1"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Jérémy GPU"
      iconURL: "/assets/jeremy-logo.svg"

    # Génération de vidéos LTX-2.5 sur Modal (service ltx-2-5). Le modèle choisi = la durée
    # totale : video-12s, video-24s, video-36s, video-48s, video-60s.
    # Mode d'emploi : joindre la photo du personnage (facultatif), écrire une scène par
    # paragraphe (ligne vide entre chaque scène), envoyer. La vidéo est prête en quelques
    # minutes ; le lien apparaît dans la réponse.
    # Clé à saisir dans l'interface : la clé du service vidéo (jamais écrite ici : dépôt public).
    # titleConvo désactivé : un titre automatique lancerait une génération vidéo.
    - name: "Vidéo"
      apiKey: "user_provided"
      baseURL: "https://g64203490--ltx-2-5-mcp.us-east.modal.run/v1"
      models:
        default: ["video-12s", "video-24s", "video-36s", "video-48s", "video-60s"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Vidéo"
      iconURL: "/assets/jeremy-logo.svg"

mcpServers:
  cloudflare:
    type: streamable-http
    url: https://mcp.cloudflare.com/mcp
    requiresOAuth: true
    timeout: 60000

  # Serveur GitHub léger (1 outil, environ 300 tokens). Chaque utilisateur clique
  # « Connecter » : OAuth GitHub automatique, token stocké par LibreChat pour lui.
  github:
    type: streamable-http
    url: https://github-mcp-lite.hounmetinjeremy.workers.dev
    requiresOAuth: true
    timeout: 60000
