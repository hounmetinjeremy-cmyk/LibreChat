# fly.toml app configuration file generated for librechat-a7cwuq on 2026-10-17T18:50:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'librechat-a7cwuq'
primary_region = 'ams'

[build]

[env]
  # Connexion par Google uniquement (pas d'email/mot de passe)
  ALLOW_EMAIL_LOGIN = 'false'
  ALLOW_REGISTRATION = 'false'
  ALLOW_SOCIAL_LOGIN = 'true'
  ALLOW_SOCIAL_REGISTRATION = 'true'
  GOOGLE_CLIENT_ID = '358155489243-03i6klg0aek034eiu2vu7jniiki22om0.apps.googleusercontent.com'
  GOOGLE_CALLBACK_URL = '/oauth/google/callback'
  # GOOGLE_CLIENT_SECRET : à mettre dans les secrets Fly.io, jamais dans ce fichier (dépôt public).
  DOMAIN_CLIENT = 'https://librechat-a7cwuq.fly.dev'
  DOMAIN_SERVER = 'https://librechat-a7cwuq.fly.dev'
  # Active Gemini (Google) : la clé est saisie dans l'interface par chaque utilisateur.
  GOOGLE_KEY = 'user_provided'
  # Liste fixe des modèles Gemini. Le premier est celui que LibreChat utilise par défaut
  # (notamment pour les appels d'outils) : gemini-3-pro-preview n'existe plus chez Google.
  GOOGLE_MODELS = 'gemini-3.1-pro-preview,gemini-3.8-flash,gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-2.5-pro,gemini-2.5-flash,gemini-2.5-flash-lite'
  # « Exécuter du code » : le code est exécuté directement sur ton terminal Fly.io.
  # Clé à saisir dans l'interface quand LibreChat la demande : le jeton du terminal (MCP_TOKEN).
  LIBRECHAT_CODE_BASEURL = 'https://terminal-mcp-hounmetin.fly.dev'

[http_service]
  internal_port = 3080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
