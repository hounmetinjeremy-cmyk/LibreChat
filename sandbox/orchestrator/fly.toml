# Orchestrateur : seul composant qui détient le jeton Fly (FLY_API_TOKEN) et les clés LLM.
# Secrets à définir avec `fly secrets set` (jamais dans ce fichier, dépôt public) :
#   FLY_API_TOKEN, ORCHESTRATOR_SECRET, LLM_API_KEY (la clé du fournisseur choisi ci-dessous)
app = 'jeremy-sbx-orch'
primary_region = 'ams'

[build]

[env]
  SANDBOX_APP = 'jeremy-sbx-jobs'
  SANDBOX_IMAGE = 'registry.fly.io/jeremy-sbx-jobs:latest'
  ORCHESTRATOR_PUBLIC_URL = 'https://jeremy-sbx-orch.fly.dev'
  SANDBOX_REGION = 'ams'
  SANDBOX_MEMORY_MB = '1024'
  DB_PATH = '/data/orch.db'
  # MODE TEST : limites très hautes pour ne jamais bloquer les essais.
  # Avant d'ouvrir au public, les baisser (voir les valeurs conseillées en commentaire).
  MAX_RUNTIME_SEC = '900'
  MAX_CONCURRENT_PER_USER = '1'
  MAX_CONCURRENT_GLOBAL = '4'
  DAILY_JOBS_PER_USER = '1000'   # public : 50
  TOKENS_PER_JOB = '3000000'     # public : 1000000
  TOKENS_PER_USER_DAY = '100000000' # public : 5000000
  # Dépense : plafond par utilisateur et par mois, en dollars, selon le modèle choisi (Aube ou Soleil).
  # Public : 7.5 (Aube, abonnement 15 $) et 15 (Soleil, abonnement 30 $), soit la moitié du prix.
  MONTHLY_SPEND_CAP_AUBE = '1000'
  MONTHLY_SPEND_CAP_SOLEIL = '1000'
  # Prix en dollars par million de tokens (utilisés si le fournisseur ne donne pas le coût de l'appel).
  PRICE_IN_PER_M = '0.035'
  PRICE_OUT_PER_M = '0.50'
  # Soleil : l'expert (modèle fort) conseille le modèle de travail quand il est bloqué.
  # Même clé OpenRouter que LLM_API_KEY. 3 consultations au plus par tâche.
  EXPERT_MODEL = 'anthropic/claude-fable-5.1'
  EXPERT_MAX_PER_JOB = '3'
  EXPERT_PRICE_IN_PER_M = '10'
  EXPERT_PRICE_OUT_PER_M = '50'
  # Remise à zéro des compteurs du jour (tâches et tokens, tous les utilisateurs) : elle a lieu au déploiement
  # quand cette valeur change. Pour recommencer plus tard : changer la valeur (ex. 'reset-3') et redéployer.
  QUOTA_RESET_ID = 'reset-2'

  # ---- Modèle de l'agent du conteneur : garder UN SEUL des deux blocs actif.
  # Pour changer : décommenter l'autre bloc, commenter celui-ci, puis remplacer le secret GitHub
  # LLM_API_KEY par la clé du fournisseur et relancer le workflow « Déployer les sandboxes Fly.io ».

  # Bloc 1 : Gemini direct (clé Google AI Studio)
  # LLM_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta/openai'
  # LLM_MODEL = 'gemini-3-flash-preview'

  # Bloc 2 (actif) : OpenRouter (clé « sk-or-v1-... »), DeepSeek Flash pour le travail
  LLM_BASE_URL = 'https://openrouter.ai/api/v1'
  LLM_MODEL = 'deepseek/deepseek-v4.1-flash'
  # Réflexion du modèle limitée (la sortie coûte 14 fois plus que l'entrée). Valeurs : none, low, medium, high.
  # Vider la valeur pour ne rien envoyer au fournisseur.
  LLM_REASONING_EFFORT = 'low'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = 'orch_data'
  destination = '/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
