# Orchestrateur : seul composant qui détient le jeton Fly (FLY_API_TOKEN) et les clés LLM.
# Secrets à définir avec `fly secrets set` (jamais dans ce fichier, dépôt public) :
#   FLY_API_TOKEN, ORCHESTRATOR_SECRET, LLM_API_KEY (la clé du fournisseur choisi ci-dessous)
app = 'jeremy-sbx-orch'
primary_region = 'ams'

[build]

[env]
  SANDBOX_APP = 'jeremy-sbx-jobs'
  SANDBOX_IMAGE = 'registry.fly.io/jeremy-sbx-jobs:latest'
  ORCHESTRATOR_PUBLIC_URL = 'https://jeremy-sbx-orch.fly.dev'
  SANDBOX_REGION = 'ams'
  SANDBOX_MEMORY_MB = '1024'
  DB_PATH = '/data/orch.db'
  # Quotas (modifiables sans toucher au code)
  MAX_RUNTIME_SEC = '900'
  MAX_CONCURRENT_PER_USER = '1'
  MAX_CONCURRENT_GLOBAL = '4'
  DAILY_JOBS_PER_USER = '50'
  TOKENS_PER_JOB = '1000000'
  TOKENS_PER_USER_DAY = '5000000'
  # Remise à zéro des compteurs du jour (tâches et tokens, tous les utilisateurs) : elle a lieu au déploiement
  # quand cette valeur change. Pour recommencer plus tard : changer la valeur (ex. 'reset-2') et redéployer.
  QUOTA_RESET_ID = 'reset-1'

  # ---- Modèle de l'agent du conteneur : garder UN SEUL des deux blocs actif.
  # Pour changer : décommenter l'autre bloc, commenter celui-ci, puis remplacer le secret GitHub
  # LLM_API_KEY par la clé du fournisseur et relancer le workflow « Déployer les sandboxes Fly.io ».

  # Bloc 1 (actif) : Gemini direct (clé Google AI Studio)
  LLM_BASE_URL = 'https://generativelanguage.googleapis.com/v1beta/openai'
  LLM_MODEL = 'gemini-3-flash-preview'

  # Bloc 2 : OpenRouter (clé « sk-or-v1-... »)
  # LLM_BASE_URL = 'https://openrouter.ai/api/v1'
  # LLM_MODEL = 'deepseek/deepseek-v4-flash'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = 'orch_data'
  destination = '/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
