name: Déployer les sandboxes Fly.io

# Lancement manuel uniquement (onglet Actions > Run workflow). Aucun déclenchement automatique.
on:
  workflow_dispatch:
    inputs:
      redeploy_librechat:
        description: "Donner le secret à LibreChat et le redémarrer (à cocher au 2e passage, une fois le test de santé réussi)"
        type: boolean
        default: false

concurrency: deploy-sandboxes

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_TOKEN }}
      JOBS_APP: jeremy-sbx-jobs
      ORCH_APP: jeremy-sbx-orch
      LIBRECHAT_APP: librechat-a7cwuq
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Créer les apps et le volume (sans effet s'ils existent déjà)
        run: |
          flyctl apps create "$JOBS_APP" || echo "$JOBS_APP existe déjà"
          flyctl apps create "$ORCH_APP" || echo "$ORCH_APP existe déjà"
          if ! flyctl volumes list -a "$ORCH_APP" | grep -q orch_data; then
            flyctl volumes create orch_data -a "$ORCH_APP" -r ams -n 1 -s 1 -y
          fi

      - name: Construire et pousser l'image des conteneurs
        working-directory: sandbox/worker
        run: flyctl deploy --build-only --push --image-label latest -a "$JOBS_APP"

      - name: Configurer les secrets de l'orchestrateur
        env:
          ORCHESTRATOR_SECRET: ${{ secrets.ORCHESTRATOR_SECRET }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          test -n "$ORCHESTRATOR_SECRET" || { echo "Secret GitHub ORCHESTRATOR_SECRET manquant"; exit 1; }
          test -n "$LLM_API_KEY" || { echo "Secret GitHub LLM_API_KEY manquant"; exit 1; }
          # Jeton limité à l'app des conteneurs : l'orchestrateur ne peut rien faire d'autre.
          TOKEN_OUT="$(flyctl tokens create deploy -a "$JOBS_APP")"
          JOBS_TOKEN="$(printf '%s\n' "$TOKEN_OUT" | grep -E '^FlyV1 ' | tail -n 1)"
          if [ -z "$JOBS_TOKEN" ]; then
            JOBS_TOKEN="$(printf '%s\n' "$TOKEN_OUT" | grep -v '^[[:space:]]*$' | tail -n 1)"
          fi
          test -n "$JOBS_TOKEN" || { echo "Jeton de l'app des conteneurs vide : flyctl tokens create n'a rien renvoyé"; exit 1; }
          echo "::add-mask::$JOBS_TOKEN"
          flyctl secrets set --stage -a "$ORCH_APP" \
            "FLY_API_TOKEN=$JOBS_TOKEN" \
            "ORCHESTRATOR_SECRET=$ORCHESTRATOR_SECRET" \
            "LLM_API_KEY=$LLM_API_KEY"

      - name: Déployer l'orchestrateur
        working-directory: sandbox/orchestrator
        run: flyctl deploy -a "$ORCH_APP" --ha=false

      - name: Test de santé
        timeout-minutes: 5
        run: curl -fsS --max-time 20 --retry 10 --retry-delay 6 --retry-connrefused "https://$ORCH_APP.fly.dev/healthz"

      - name: Diagnostic de l'orchestrateur (en cas d'échec)
        if: ${{ failure() }}
        run: |
          flyctl status -a "$ORCH_APP" || true
          flyctl secrets list -a "$ORCH_APP" || true
          flyctl logs -a "$ORCH_APP" --no-tail | tail -n 40 || true

      - name: Donner le secret à LibreChat (redémarre LibreChat)
        if: ${{ inputs.redeploy_librechat }}
        env:
          ORCHESTRATOR_SECRET: ${{ secrets.ORCHESTRATOR_SECRET }}
        run: flyctl secrets set -a "$LIBRECHAT_APP" "ORCHESTRATOR_SECRET=$ORCHESTRATOR_SECRET"
